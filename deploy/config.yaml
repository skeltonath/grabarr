# Grabarr's production config, mounted read-only at /etc/grabarr/config.yaml
# (docker-compose.yml). Komodo redeploys on every push to main, so a change here
# is a commit, never an edit on millions.
#
# $-style variable references are expanded from the container's environment when the file is loaded.
# Their values are Komodo variables (GRABARR_*), listed in docker-compose.yml.
#
# The values on the web UI's Settings page (jobs.max_concurrent,
# jobs.max_retries, jobs.cleanup_*, gatekeeper.seedbox.bandwidth_limit_mbps,
# gatekeeper.cache_disk.max_usage_percent, sync.enabled, sync.scan_interval)
# can be overridden there. Overrides are stored in the database and win over
# this file until they are reset; everything else comes only from here.

server:
  port: 8080
  host: "0.0.0.0"
  shutdown_timeout: "30s"
  # Public origin. The Pocket ID redirect URI is <base_url>/auth/callback.
  base_url: "https://grabarr.internal.dppeppel.me"

# Sign-in. The Pocket ID client "grabarr" only admits the household group.
# Scripts use API tokens instead: `docker exec grabarr /app/grabarr token create NAME`.
auth:
  oidc:
    issuer: "https://id.dppeppel.me"
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
  dev_login: false
  session_days: 90

downloads:
  local_path: "/unraid/user/media/downloads/"
  allowed_categories: ["dp-movies", "dp-tv", "dp-anime", "dp-books", "dp-audiobooks"]

remotes:
  - name: "whatbox"
    ssh_host: "pandora.whatbox.ca"
    ssh_user: "psychomanteum"
    ssh_key_file: "/config/grabarr_rsa"
    watched_paths:
      - remote_path: "/home/psychomanteum/downloads/completed/dp/"
        local_path: ""
        extensions: ["mkv", "mp4", "avi", "srt", "sub"]
        archive_extensions: ["rar", "zip"]
        exclude_patterns: ["(?i)\\.sample\\.", "(?i)sample\\."]
        auto_download: true
        recursive: true
      # Books (Shelfmark): categories dp-books / dp-audiobooks save under completed/books/.
      # Lands in /mnt/user/media/downloads/books/, which Shelfmark sees as /downloads/books.
      - remote_path: "/home/psychomanteum/downloads/completed/books/"
        local_path: "/unraid/user/media/downloads/books/"
        extensions: ["epub", "kepub", "mobi", "azw", "azw3", "pdf", "fb2", "cbz", "cbr", "cb7", "m4b", "m4a", "mp3", "flac", "opus", "ogg", "aac", "jpg", "png", "cue", "nfo"]
        archive_extensions: ["rar", "zip"]
        exclude_patterns: ["(?i)\\.sample\\.", "(?i)sample\\."]
        auto_download: true
        recursive: true

gatekeeper:
  seedbox:
    bandwidth_limit_mbps: 500  # Max 500Mbps out of 1Gbps seedbox connection
    check_interval: "30s"
  cache_disk:
    path: "/unraid/cache"
    max_usage_percent: 80  # Don't exceed 80% cache usage
    check_interval: "30s"
  rules:
    require_filesize_check: true  # Check if file fits before starting job

jobs:
  max_concurrent: 3
  max_retries: 5
  cleanup_completed_after: "168h"  # Clean completed jobs after 7 days
  cleanup_failed_after: "720h"    # Keep failed jobs longer for troubleshooting

database:
  path: "/data/grabarr.db"

notifications:
  pushover:
    token: "${PUSHOVER_TOKEN}"
    user: "${PUSHOVER_USER}"
    enabled: true
    priority: 0              # -2 to 2, 0 is normal
    retry_interval: "60s"    # For priority 2 messages
    expire_time: "3600s"     # For priority 2 messages

logging:
  level: "info"
  format: "json"

sync:
  enabled: true
  scan_interval: "5m"

extraction:
  enabled: true
  cleanup_archives: true  # Delete archive files after successful extraction

# Radarr/Sonarr instances told when a transfer lands locally. Their download
# client is qBittorrent on the seedbox, which reports "complete" when the
# torrent finishes there — long before grabarr has rsynced the file here — so
# without this they retry against a path that does not exist yet.
media_managers:
  debounce: "30s"   # coalesce a season pack's per-file completions into one refresh
  instances:
    - name: "radarr"
      enabled: true
      url: "http://radarr:7878"
      api_key: "${RADARR_API_KEY}"
      categories: ["dp-movies"]
    - name: "sonarr"
      enabled: true
      url: "http://sonarr:8989"
      api_key: "${SONARR_API_KEY}"
      categories: ["dp-tv", "dp-anime"]
