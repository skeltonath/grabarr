services:
  grabarr:
    image: grabarr:latest
    build: .   # built on millions by Komodo
    container_name: grabarr
    restart: unless-stopped
    mem_limit: 1g
    user: "99:100"  # Use Unraid nobody user
    volumes:
      # Configuration and data persistence
      - /mnt/apps/appdata/grabarr/config:/config
      - /mnt/apps/appdata/grabarr/data:/data

      # Unraid mount points
      - /mnt/user:/unraid/user:rw        # Main array access
      - /mnt/cache:/unraid/cache:rw      # Cache drive access

    env_file:
      - .env  # Load environment variables from .env file

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Health check
    healthcheck:
      test: ["CMD", "/app/grabarr", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - media

networks:
  # The NAS's media network, shared with Sonarr/Radarr and Caddy, which creates it
  # (skeltonath/nas stacks/caddy/compose.yaml). No host ports: use http://grabarr.internal.
  media:
    external: true
