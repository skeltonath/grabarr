services:
  grabarr:
    image: grabarr:latest
    build: .   # built on millions by Komodo
    container_name: grabarr
    restart: unless-stopped
    mem_limit: 1g
    user: "99:100"  # Use Unraid nobody user
    volumes:
      - ./deploy/config.yaml:/etc/grabarr/config.yaml:ro
      - /mnt/apps/appdata/grabarr/config:/config   # SSH key (grabarr_rsa), not in git
      - /mnt/apps/appdata/grabarr/data:/data

      # Unraid mount points
      - /mnt/user:/unraid/user:rw        # Main array access
      - /mnt/cache:/unraid/cache:rw      # Cache drive access

    environment:
      GRABARR_CONFIG: /etc/grabarr/config.yaml
      TZ: ${TZ:-}
      # Secrets: Komodo variables, written to .env by the stack's environment
      # and expanded into deploy/config.yaml.
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Health check
    healthcheck:
      test: ["CMD", "/app/grabarr", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - media

networks:
  # The NAS's media network, shared with Sonarr/Radarr and Caddy, which creates it
  # (skeltonath/nas stacks/caddy/compose.yaml). No host ports: use http://grabarr.internal.
  media:
    external: true
